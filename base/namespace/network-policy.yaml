# Default deny all ingress và egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: team-TEAM_NAME
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow DNS resolution
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: team-TEAM_NAME
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Allow access to Ceph S3 (RGW)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ceph-s3
  namespace: team-TEAM_NAME
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph
      ports:
        - port: 80
          protocol: TCP
---
# Allow access to Iceberg REST Catalog
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-iceberg-rest
  namespace: team-TEAM_NAME
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-storage
      ports:
        - port: 8181
          protocol: TCP
---
# Allow access to Trino
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-trino
  namespace: team-TEAM_NAME
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-compute
      ports:
        - port: 8080
          protocol: TCP
---
# Allow access to Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka
  namespace: team-TEAM_NAME
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-compute
      ports:
        - port: 9092
          protocol: TCP
---
# Allow Airflow to create/manage worker pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-airflow-ingress
  namespace: team-TEAM_NAME
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-data
---
# Allow Prometheus scraping
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: team-TEAM_NAME
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ops
      ports:
        - port: 4040   # Spark UI
          protocol: TCP
        - port: 8090   # Spark JMX exporter
          protocol: TCP
        - port: 9090   # Custom metrics
          protocol: TCP