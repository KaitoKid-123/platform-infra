apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: platform-streaming
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: platform-streaming
spec:
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: admin
      port: 9644
      targetPort: 9644
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: platform-streaming
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: platform-streaming
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/part-of: platform-streaming
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.3.10
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -lc
            - |
              redpanda start \
                --overprovisioned \
                --smp 1 \
                --memory 512M \
                --reserve-memory 0M \
                --node-id 0 \
                --kafka-addr PLAINTEXT://0.0.0.0:9092 \
                --advertise-kafka-addr PLAINTEXT://redpanda.platform-streaming.svc.cluster.local:9092 \
                --pandaproxy-addr 0.0.0.0:8082 \
                --advertise-pandaproxy-addr redpanda.platform-streaming.svc.cluster.local:8082 \
                --rpc-addr 0.0.0.0:33145 \
                --advertise-rpc-addr redpanda.platform-streaming.svc.cluster.local:33145
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9644
              name: admin
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redpanda-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redpanda-data
  namespace: platform-streaming
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
