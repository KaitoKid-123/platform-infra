apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - spark-streaming-role.yaml
  - spark-streaming-namespace-role-binding.yaml
  - streaming-checkpoint-pvc.yaml
helmCharts:
  - name: redpanda
    repo: https://charts.redpanda.com
    version: 5.10.7
    releaseName: redpanda
    namespace: platform-streaming
    valuesFile: redpanda-values.yaml

# Use the upstream chart, but with a much smaller memory footprint so the
# broker can start on the available dev-cluster nodes.
