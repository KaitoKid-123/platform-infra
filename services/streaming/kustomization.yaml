apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - redpanda.yaml
  - spark-streaming-role.yaml
  - spark-streaming-namespace-role-binding.yaml
  - streaming-checkpoint-pvc.yaml

# Keep the streaming stack self-contained and avoid a Helm dependency here.
# The Redpanda chart requires cert-manager resources and extra TLS plumbing,
# which makes a first-pass deployment brittle in clusters that do not yet
# have the full Redpanda operator stack installed.
