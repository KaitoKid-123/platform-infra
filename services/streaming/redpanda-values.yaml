replicas: 1

image:
  repository: docker.redpanda.com/redpandadata/redpanda
  tag: v25.1.12

fullnameOverride: redpanda
nameOverride: redpanda

rbac:
  enabled: true

serviceAccount:
  create: true
  name: redpanda

listeners:
  kafka:
    port: 9092
  admin:
    port: 9644
  http:
    enabled: false
  schemaRegistry:
    enabled: false

external:
  enabled: false
  service:
    enabled: false

storage:
  persistentVolume:
    enabled: true
    storageClass: local-path
    size: 10Gi

resources:
  cpu:
    cores: 1
  memory:
    # The Redpanda Helm chart validates that container memory is large
    # enough for the internal Redpanda + reserve memory budget.
    # 512Mi is too small for this chart version, so use a safer dev size.
    container:
      max: 896Mi

# The chart validates that the container memory must exceed the internal
# Redpanda + reserve memory budget. 896Mi keeps the broker lightweight while
# avoiding the render-time validation failure.

# Redpanda on a small 4-node dev cluster needs a tighter memory budget.
# The default 1Gi container limit leaves too little room for the runtime
# after Redpanda's own reservation and triggers CrashLoopBackOff.

console:
  enabled: false

tests:
  enabled: false

tls:
  enabled: false

statefulset:
  replicas: 1
  additionalRedpandaCmdFlags: []
