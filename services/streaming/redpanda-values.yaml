replicas: 1

image:
  repository: docker.redpanda.com/redpandadata/redpanda
  tag: v25.1.12

fullnameOverride: redpanda
nameOverride: redpanda

rbac:
  enabled: true

serviceAccount:
  create: true
  name: redpanda

listeners:
  kafka:
    port: 9092
  admin:
    port: 9644
  http:
    enabled: false
  schemaRegistry:
    enabled: false

external:
  enabled: false
  service:
    enabled: false

storage:
  persistentVolume:
    enabled: true
    storageClass: local-path
    size: 10Gi

resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 768Mi

# Redpanda on a small 4-node dev cluster needs a tighter memory budget.
# The default 1Gi container limit leaves too little room for the runtime
# after Redpanda's own reservation and triggers CrashLoopBackOff.

console:
  enabled: false

tests:
  enabled: false

tls:
  enabled: false

statefulset:
  replicas: 1
  additionalRedpandaCmdFlags: []
