replicas: 1

image:
  repository: docker.redpanda.com/redpandadata/redpanda
  tag: v25.1.12

fullnameOverride: redpanda
nameOverride: redpanda

rbac:
  enabled: true

serviceAccount:
  create: true
  name: redpanda

listeners:
  kafka:
    port: 9092
  admin:
    port: 9644
  http:
    enabled: false
  schemaRegistry:
    enabled: false

external:
  enabled: false
  service:
    enabled: false

storage:
  persistentVolume:
    enabled: true
    storageClass: local-path
    size: 10Gi

resources:
  cpu:
    cores: 1
  memory:
    # Keep the memory limit above the chart minimum so ArgoCD/Helm schema
    # validation and the Redpanda runtime both have enough headroom.
    container:
      max: 1536Mi

console:
  enabled: false

tests:
  enabled: false

tls:
  enabled: false

statefulset:
  replicas: 1
  additionalRedpandaCmdFlags: []
