# Allow all pods to reach Docker registry TCP 5000
# Scope: clusterwide for development environment
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-registry-egress
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  egress:
    - toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
