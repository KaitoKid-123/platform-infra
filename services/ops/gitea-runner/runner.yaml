---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-data
  namespace: platform-ops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-secret
  namespace: platform-ops
type: Opaque
stringData:
  registration-token: "HkYC3uaaWlklYRs9kD67b2CCs6ybqbmn2cETLL6m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: platform-ops
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 2
      envs:
        DOCKER_HOST: tcp://localhost:2375
        DOCKER_TLS_VERIFY: ""
      fetch_timeout: 5s
      fetch_interval: 2s
    cache:
      enabled: false
    container:
      network: ""
      privileged: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-act-runner
  namespace: platform-ops
  labels:
    app: gitea-act-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea-act-runner
  template:
    metadata:
      labels:
        app: gitea-act-runner
    spec:
      hostAliases:
        - ip: "10.98.236.132"
          hostnames:
            - docker-registry.platform-storage
            - docker-registry.platform-storage.svc.cluster.local
        - ip: "10.96.69.19"
          hostnames:
            - gitea-http.platform-ops
            - gitea-http.platform-ops.svc.cluster.local
      restartPolicy: Always
      initContainers:
        - name: register
          image: gitea/act_runner:latest
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/.runner ]; then
                act_runner register \
                  --config /config.yaml \
                  --no-interactive \
                  --instance http://gitea-http.platform-ops:3000 \
                  --token $(RUNNER_TOKEN) \
                  --name platform-runner \
                  --labels ubuntu-latest:docker://nikolaik/python-nodejs:python3.10-nodejs20,ubuntu-22.04:docker://nikolaik/python-nodejs:python3.10-nodejs20
                echo "Runner registered."
              else
                echo "Runner already registered, skipping."
              fi
          env:
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-secret
                  key: registration-token
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /config.yaml
              subPath: config.yaml
      containers:
        - name: runner
          image: gitea/act_runner:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for Docker daemon on port 2375..."
              until nc -z localhost 2375 2>/dev/null || \
                    (echo > /dev/tcp/localhost/2375) 2>/dev/null; do
                sleep 2
              done
              echo "Docker ready. Starting runner."
              exec act_runner daemon --config /config.yaml
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: DOCKER_TLS_VERIFY
              value: "0"
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
        - name: dind
          image: docker:24-dind
          command:
            - sh
            - -c
            - |
              dockerd \
                --insecure-registry=docker-registry.platform-storage:5000 \
                --host=unix:///var/run/docker.sock \
                --host=tcp://0.0.0.0:2375 \
                --storage-driver=overlay2 &
              echo "Waiting for Docker daemon..."
              until docker info > /dev/null 2>&1; do sleep 1; done
              echo "Docker daemon ready."
              exec tail -f /dev/null
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: gitea-runner-data
        - name: runner-config
          configMap:
            name: gitea-runner-config
        - name: docker-storage
          emptyDir: {}
