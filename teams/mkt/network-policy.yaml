# 7. Cho phép Airflow tạo + quản lý worker pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-airflow-ingress
  namespace: team-mkt
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-data
---
# 8. Cho phép Prometheus scrape metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: team-mkt
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ops
      ports:
        - port: 4040   # Spark UI
          protocol: TCP
        - port: 8090   # Spark JMX exporter
          protocol: TCP
        - port: 9090   # Custom metrics
          protocol: TCP