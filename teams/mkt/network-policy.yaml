# 1. Default deny tất cả ingress + egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: team-mkt
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2. Cho phép DNS resolution (CoreDNS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: team-mkt
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# 3. Cho phép truy cập Ceph S3 RGW
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ceph-s3
  namespace: team-mkt
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph
      ports:
        - port: 80
          protocol: TCP
---
# 4. Cho phép truy cập Iceberg REST Catalog
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-iceberg-rest
  namespace: team-mkt
spec:
  podSelector: {}
  policyTypes:
