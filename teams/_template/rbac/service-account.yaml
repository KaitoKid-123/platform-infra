# ServiceAccount cho Spark Operator tạo executor pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-team-TEAM_NAME
  namespace: team-TEAM_NAME
---
# ServiceAccount cho read-only access (dùng trong CI/CD tools)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-TEAM_NAME-reader
  namespace: team-TEAM_NAME