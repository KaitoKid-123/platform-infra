apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: team-finance-default
  namespace: team-finance
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              team: finance
  egress:
    - {}
