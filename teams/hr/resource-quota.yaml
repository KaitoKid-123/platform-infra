apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: team-hr
spec:
  hard:
    requests.cpu: "1"              # Dev: 1 CPU (prod: 16)
    requests.memory: 2Gi           # Dev: 2Gi (prod: 64Gi)
    limits.cpu: "2"                # Dev: 2 CPU (prod: 32)
    limits.memory: 4Gi             # Dev: 4Gi (prod: 128Gi)
    requests.storage: 20Gi         # Dev: 20Gi (prod: 2Ti)
    count/pods: "10"               # Dev: 10 (prod: 100)
    count/services: "5"
    count/sparkapplications.sparkoperator.k8s.io: "2"
    count/scheduledsparkapplications.sparkoperator.k8s.io: "1"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-limits
  namespace: team-hr
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 2Gi
      min:
        cpu: 10m
        memory: 32Mi
    - type: PersistentVolumeClaim
      max:
        storage: 10Gi