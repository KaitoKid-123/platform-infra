# GitHub Personal Access Token (PAT) cho ArgoCD sync từ GitHub
# Thay thế <GITHUB_PAT> bằng token thực của bạn
# Generate PAT at: https://github.com/settings/tokens
# Required scopes: repo (full control)
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-github-token
  namespace: argocd
type: Opaque
stringData:
  username: "KaitoKid-123"
  # Replace with your GitHub PAT
  password: "ghp_REPLACE_WITH_YOUR_PAT_TOKEN"

# Nếu dùng SealedSecrets, chạy:
# kubectl create secret generic argocd-github-token \
#   --from-literal=username=KaitoKid-123 \
#   --from-literal=password='YOUR_GITHUB_PAT' \
#   --namespace argocd --dry-run=client -o yaml | \
#   kubeseal --controller-namespace kube-system --format yaml > argocd-github-token.yaml
