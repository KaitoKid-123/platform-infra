# SealedSecret chứa Gitea personal access token cho ArgoCD
# Sinh bởi:
#   kubectl create secret generic argocd-gitea-token \
#     --from-literal=username=argocd \
#     --from-literal=password='<GITEA_TOKEN>' \
#     --namespace argocd --dry-run=client -o yaml | \
#     kubeseal --controller-namespace kube-system --format yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-gitea-token
  namespace: argocd
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    username: "<SEALED_ENCRYPTED_VALUE_REPLACE_ME>"
    password: "<SEALED_ENCRYPTED_VALUE_REPLACE_ME>"
  template:
    metadata:
      name: argocd-gitea-token
      namespace: argocd
    type: Opaque