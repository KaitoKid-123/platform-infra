apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.platform-ops:3000/data-platform/platform-infra
    targetRevision: main
    path: services/ops
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true