apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-streaming
  namespace: argocd
  labels:
    app: platform-streaming
    appgroup: platform
spec:
  project: default
  source:
    repoURL: https://github.com/KaitoKid-123/platform-infra
    targetRevision: main
    path: services/streaming
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-streaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
